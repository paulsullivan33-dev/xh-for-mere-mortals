site_name: xh for Mere Mortals
site_description: A friendly HTTP client that speaks the HTTPie language as one small fast binary. Building requests from small labelled items, reading pretty replies without mistaking them for the wire, proving every claim against a server that reports what it received, and knowing when curl is the right tool instead.
site_url: https://paulsullivan33-dev.github.io/xh-for-mere-mortals/
